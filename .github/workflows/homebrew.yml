name: Bump Homebrew Cask

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true

permissions:
  contents: read

# Serialize bumps from this repo
concurrency:
  group: homebrew-bump
  cancel-in-progress: false

env:
  APP_NAME: AppPad
  CASK: apppad
  TAP_REPO: umindhub/homebrew-tap

jobs:
  bump:
    # Skip prereleases (Beta builds)
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Resolve version
        run: |
          if [ -z "$TAG" ]; then echo "No tag"; exit 1; fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Download DMG and compute sha256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "${APP_NAME}-${VERSION}.dmg"
          echo "SHA256=$(sha256sum "${APP_NAME}-${VERSION}.dmg" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update cask
        working-directory: tap
        run: |
          sed -i -E \
            -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"${SHA256}\"/" \
            "Casks/${CASK}.rb"
          # Fail loudly if the stanzas were not matched
          grep -q "^  version \"${VERSION}\"" "Casks/${CASK}.rb"
          grep -q "^  sha256 \"${SHA256}\"" "Casks/${CASK}.rb"
          git diff --stat

      - name: Commit and push
        working-directory: tap
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "${CASK} ${VERSION}"
          # Other app repos push to the same tap: rebase and retry on race
          for i in 1 2 3; do
            git push && exit 0
            sleep 3
            git pull --rebase
          done
          exit 1
